    "numpy (>=2.4.2,<3.0.0)",
    "minizinc (>=0.10.0,<0.11.0)",
    "zython (>=0.6.0,<0.7.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "kaleido (>=1.2.0,<2.0.0)"
